<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisnu Bayu Samudra – Full-Stack Web Developer</title>
    <meta name="description" content="Portofolio Wisnu Bayu Samudra, mahasiswa Universitas Dipa Makassar yang fokus pada Full-Stack Web Development dengan JavaScript.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Wisnu Bayu Samudra – Full-Stack Web Developer">
    <meta property="og:description" content="Portofolio mahasiswa yang membangun aplikasi web dengan JavaScript.">
    <meta property="og:image" content="https://innuu.github.io/portfix/assets/foto.jpeg">
    <meta name="theme-color" content="#2c6bc7">
    <link rel="icon" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>document.documentElement.classList.add('js')</script>
</head>
<body>

    <nav class="navbar" aria-label="Navigasi utama">
        <div class="container nav-container">
            <a href="#home" class="logo"><img src="assets/logo.png" alt="Wisnu Bayu Samudra"></a>
            <ul class="nav-links" id="menu">
                <li><a href="#home" data-i18n="nav_home">Beranda</a></li>
                <li><a href="#skills" data-i18n="nav_skills">Keahlian</a></li>
                <li><a href="#project" data-i18n="nav_projects">Proyek</a></li>
                <li><a href="#about" data-i18n="nav_about">Tentang</a></li>
                <li id="navContact" hidden><a href="#contact" data-i18n="nav_contact">Kontak</a></li>
            </ul>
            <div class="nav-tools">
                <div class="lang" role="group" aria-label="Bahasa / Language">
                    <button type="button" data-lang="id" aria-pressed="true">ID</button>
                    <button type="button" data-lang="en" aria-pressed="false">EN</button>
                </div>
                <button type="button" class="icon-btn" id="themeBtn"></button>
                <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-expanded="false" aria-controls="menu">☰</button>
            </div>
        </div>
    </nav>

    <header id="home" class="hero">
        <div class="container hero-content fade-up">
            <div class="hero-text">
                <span class="subtitle" data-i18n="subtitle">Mahasiswa Universitas Dipa Makassar</span>
                <p class="hero-greeting" data-i18n="greet">Halo, saya</p>
                <h1 class="hero-name">WISNU BAYU SAMUDRA</h1>
                <p class="hero-role"><span class="typing-text">Fullstack Developer</span></p>
                <p class="lead" data-i18n="tagline"></p>
                <div class="hero-btns">
                    <a href="#project" class="btn-primary" data-i18n="cta_projects"></a>
                    <a href="#about" class="btn-secondary" data-i18n="cta_about"></a>
                </div>
            </div>
            <div class="hero-image">
                <img src="assets/foto.jpeg" alt="Foto Wisnu Bayu Samudra" decoding="async">
            </div>
        </div>
    </header>

    <section id="skills" class="skills">
        <div class="container">
            <h2 class="section-title fade-up" data-i18n="skills_title"></h2>
            <div class="skill-groups fade-up">
                <div><h3 data-i18n="g_front"></h3><div class="skills-grid"><span class="badge">HTML5</span><span class="badge">CSS3</span><span class="badge">JavaScript</span><span class="badge">React.js</span></div></div>
                <div><h3 data-i18n="g_back"></h3><div class="skills-grid"><span class="badge">Node.js</span><span class="badge">PostgreSQL</span></div></div>
                <div><h3 data-i18n="g_tools"></h3><div class="skills-grid"><span class="badge">Git</span></div></div>
            </div>
        </div>
    </section>

    <div class="divider"></div>

    <section id="project" class="projects">
        <div class="container">
            <h2 class="section-title fade-up" data-i18n="projects_title"></h2>
            <div class="project-grid" id="project-list"></div>
        </div>
    </section>

    <section id="about" class="about">
        <div class="container fade-up">
            <h2 class="section-title" data-i18n="about_title"></h2>
            <div class="about-text">
                <p data-i18n="about_p1"></p>
                <p data-i18n="about_p2"></p>
            </div>
        </div>
    </section>

    <section id="contact" class="contact" hidden>
        <div class="container fade-up">
            <h2 class="section-title" data-i18n="contact_title"></h2>
            <p class="contact-text" data-i18n="contact_text"></p>
            <div class="contact-links" id="contact-links"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">© 2026 Wisnu Bayu Samudra</div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
